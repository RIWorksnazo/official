<script>

function toggleMenu(){

    const menu = document.getElementById("menu");
    const button = document.querySelector(".hamburger");
    const overlay = document.getElementById("menuOverlay");

    menu.classList.toggle("show");
    button.classList.toggle("open");

    if(menu.classList.contains("show")){
        button.innerHTML = "✕";
        document.body.classList.add("menu-open");
        overlay.style.display = "block";
    }else{
        button.innerHTML = "☰";
        document.body.classList.remove("menu-open");
        overlay.style.display = "none";
    }

}


// 背景クリックで閉じる
document.getElementById("modal").addEventListener("click",function(e){

    if(e.target===this){
        closeModal();
    }

});

function openModal(
image,
title,
hashtag,
catchcopy,
time,
price,
type,
people,
history
){

    document.getElementById("modalImage").src = image;

    document.getElementById("modalTitle").textContent = title;

    document.getElementById("modalHashtag").textContent = "#" + hashtag;

    document.getElementById("modalHashtag").href =
        "https://x.com/search?q=%23" + encodeURIComponent(hashtag);

    document.getElementById("modalCatch").textContent = catchcopy;

    document.getElementById("modalTime").textContent = time;

    document.getElementById("modalPrice").textContent = price;

    document.getElementById("modalType").textContent = type;

    document.getElementById("modalPeople").textContent = people;

    document.getElementById("modalHistory").innerHTML =
        history.replace(/\n/g,"<br>");

    document.getElementById("modal").classList.add("show");
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}

</script>
