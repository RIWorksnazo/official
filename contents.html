<script>

function toggleMenu(){

    const menu = document.getElementById("menu");
    const button = document.querySelector(".hamburger");
    const overlay = document.getElementById("menuOverlay");

    menu.classList.toggle("show");
    button.classList.toggle("open");

    if(menu.classList.contains("show")){
        button.innerHTML = "✕";
        document.body.classList.add("menu-open");
        overlay.style.display = "block";
    }else{
        button.innerHTML = "☰";
        document.body.classList.remove("menu-open");
        overlay.style.display = "none";
    }

}


// 背景クリックで閉じる
document.getElementById("modal").addEventListener("click",function(e){

    if(e.target===this){
        closeModal();
    }

});

function openModal(
event,
image,
title,
hashtag,
catchcopy,
time,
price,
type,
typeLabel,
people,
history
){

    cards.forEach(c=>c.classList.remove("active"));
  
    event.currentTarget.classList.add("active");

    document.getElementById("modalImage").src = image;

    document.getElementById("modalTitle").textContent = title;

    document.getElementById("modalHashtag").textContent = "#" + hashtag;

    document.getElementById("modalHashtag").href =
        "https://x.com/search?q=%23" + encodeURIComponent(hashtag);

    document.getElementById("modalCatch").textContent = catchcopy;

    document.getElementById("modalTime").textContent = time;

    document.getElementById("modalPrice").textContent = price;

    document.getElementById("modalType").textContent = type;

    document.getElementById("modalTypeLabel").textContent = typeLabel;

    document.getElementById("modalPeople").textContent = people;

    document.getElementById("modalHistory").innerHTML =
        history.replace(/\n/g,"<br>");

    const peopleRow = document.getElementById("peopleRow");
    const historyTitle = document.getElementById("historyTitle");
    const historyDiv = document.getElementById("modalHistory");
    const typeLabelRow = document.getElementById("TypeLabelRow");
    const typeRow = document.getElementById("TypeRow");
    peopleRow.style.display = people ? "" : "none";
    historyTitle.style.display = history ? "" : "none";
    historyDiv.style.display = history ? "" : "none";
    typeLabelRow.style.display = typeLabel ? "" : "none";
    typeRow.style.display = type ? "" : "none";

    document.getElementById("modal").classList.add("show");
}

function closeModal(){

    document.getElementById("modal").classList.remove("show");

    cards.forEach(c => c.classList.remove("active"));

    setTimeout(() => {
        document.querySelector(".modal-box").scrollTop = 0;
    }, 300);
}

const cards = document.querySelectorAll(".content-card");


let currentCard = null;


let touchX = 0;
let touchY = 0;

document.addEventListener("touchmove", (e) => {

    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;

    const element = document.elementFromPoint(touchX, touchY);
    const card = element?.closest(".content-card");

    if (card !== currentCard) {

        if (currentCard) {
            currentCard.classList.remove("touching");
        }

        if (card) {
            card.classList.add("touching");
        }

        currentCard = card;
    }

}, { passive: true });

let touching = false;

document.addEventListener("touchstart", () => {
    touching = true;
}, { passive:true });

document.addEventListener("touchend", () => {

    touching = false;

    cards.forEach(c => c.classList.remove("touching"));

    currentCard = null;

});

document.addEventListener("touchcancel", () => {

    touching = false;

    cards.forEach(c => c.classList.remove("touching"));

    currentCard = null;

});


function filterContents(type){

    const cards = document.querySelectorAll(".content-card");

    cards.forEach(card=>{

        if(type==="all"){
            card.style.display="";
        }

        else if(card.classList.contains(type)){
            card.style.display="";
        }

        else{
            card.style.display="none";
        }

    });

    document
        .querySelectorAll(".filter-buttons button")
        .forEach(btn=>btn.classList.remove("active"));

    event.currentTarget.classList.add("active");

}


</script>
