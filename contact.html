<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>RI:Works Official</title>

<link rel="icon" href="favicon.png" type="image/png">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- 背景 -->

<div class="background">
  <img src="risu.png" class="bg-logo">
</div>

<!-- ナビ -->

<nav class="navbar">

  <div class="logo">
    <img src="risu.png" class="logo-icon">
    <img src="rogo.png" class="logo-text">
  </div>

  <!-- ハンバーガー -->
  <div class="hamburger" onclick="toggleMenu()">
    ☰
  </div>

  <div class="menu" id="menu">
    <a href="index.html">TOP</a>
    <a href="about.html">ABOUT</a>
    <a href="news.html">NEWS</a>
    <a href="contents.html">CONTENTS</a>
    <a href="creator.html">CREATOR</a>
    <a href="contact.html">CONTACT</a>
  </div>

</nav>

<!-- CONTACT -->

<section id="contact">

  <div class="contact-box">

    <div class="section-title">

      <h2>
        CONTACT
      </h2>

    </div>

    <p>
      イベント制作依頼、
      コラボレーションなど、
      お気軽にお問い合わせください。
    </p>

    <div class="contact-buttons">

      <a href="https://x.com/RI_Works_nazo" target="_blank" class="btn btn-main">
        公式X
      </a>

      <a href="mailto:riworksnazo@gmail.com" class="btn btn-sub">
        メール
      </a>

    </div>

  </div>

</section>

<footer>
  ⓒ 2026 RI:Works
</footer>

<script>

function toggleMenu(){

    const menu = document.getElementById("menu");
    const button = document.querySelector(".hamburger");

    menu.classList.toggle("show");
    button.classList.toggle("open");

    if(menu.classList.contains("show")){
        button.innerHTML = "✕";
    }else{
        button.innerHTML = "☰";
    }

}

</script>

</body>
