<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>RI:Works Official</title>

<link rel="icon" href="favicon.png" type="image/png">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- 背景 -->

<div class="background">
  <img src="risu.png" class="bg-logo">
</div>

<!-- ナビ -->

<nav class="navbar">

  <div class="logo">
    <img src="risu.png" class="logo-icon">
    <img src="rogo.png" class="logo-text">
  </div>

  <!-- ハンバーガー -->
  <div class="hamburger" onclick="toggleMenu()">
    ☰
  </div>

  <div class="menu" id="menu">
    <a href="index.html">TOP</a>
    <a href="about.html">ABOUT</a>
    <a href="news.html">NEWS</a>
    <a href="contents.html">CONTENTS</a>
    <a href="creator.html">CREATOR</a>
    <a href="contact.html">CONTACT</a>
  </div>

</nav>

<!-- TOP -->

<header id="top">

  <div class="hero">

    <img src="rogo.png" class="hero-logo fade-up delay1">

    <p class="fade-up delay2">

      RI:Worksは、全国に制作メンバーがいる学生謎解き団体です。<br>

      誰でも楽しめる、
      他にはない脱出ゲームを開催しています。

    </p>

    <div class="buttons fade-up delay3">

      <a href="contents.html" class="btn btn-main">
        最新コンテンツ
      </a>
      
      <a href="contact.html" class="btn btn-sub">
        お問い合わせ
      </a>

    </div>

    <!-- TOP内にPICKUPを移動 -->

    <div class="pickup-grid">

      <div class="pickup-card">

        <div class="pickup-image"></div>

        <div class="pickup-body">

          <h3>
            公式サイトを公開しました！
          </h3>

          <p>
            RI:Worksの公式サイトを公開しました。
            今後の最新情報などを掲載予定です。
          </p>

        </div>

      </div>

      <div class="pickup-card">

        <div class="pickup-image"></div>

        <div class="pickup-body">

          <h3>
            Coming Soon...
          </h3>

          <p>
            最新情報を準備中です。
          </p>

        </div>

      </div>

    </div>

  </div>

</header>


<footer>
  ⓒ 2026 RI:Works
</footer>

<script>

function toggleMenu(){

    const menu = document.getElementById("menu");
    const button = document.querySelector(".hamburger");

    menu.classList.toggle("show");

    if(menu.classList.contains("show")){
        button.innerHTML = "✕";
    }else{
        button.innerHTML = "☰";
    }

}
</script>

</body>
</html>
